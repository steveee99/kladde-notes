<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Opaque status bar on purpose: since iOS 26.1 a home-screen app with "black-translucent" gets a
      blur over the status bar and a viewport that ends short by the bar's height (WebKit bug 301108),
      so the header sat half under the bar and the bottom nav floated above an empty strip.
      iOS keeps the style an app was installed with: remove and re-add the app after changing it.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kladde" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Kladde</title>
    <script>
      // Theme and layout width before first paint, so there is no flash
      try {
        var t = localStorage.getItem('kladde_theme') || 'system';
        if (t === 'dark' || t === 'oled') t = 'material';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'material' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      try {
        var w = localStorage.getItem('kladde_widescreen');
        var cfg = w ? JSON.parse(w) : null;
        var mode = (cfg && (cfg.mode === 'fluid' || cfg.mode === 'fixed')) ? cfg.mode : 'fixed';
        var width = (cfg && typeof cfg.width === 'number' && cfg.width >= 480 && cfg.width <= 3840) ? Math.round(cfg.width) : 1200;
        document.documentElement.dataset.widescreen = mode;
        document.documentElement.style.setProperty('--content-width', mode === 'fluid' ? 'none' : width + 'px');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
