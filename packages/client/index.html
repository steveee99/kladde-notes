<!doctype html>
<html lang="de" data-theme="material" data-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Opaque status bar on purpose: since iOS 26.1 a home-screen app with "black-translucent" gets a
      blur over the status bar and a viewport that ends short by the bar's height (WebKit bug 301108),
      so the header sat half under the bar and the bottom bar floated above an empty strip.
      iOS keeps the style an app was installed with: remove and re-add the app after changing it.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kladde" />
    <meta name="theme-color" content="#0E0E10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Kladde</title>
    <script>
      // Language, Material 3 theme and color scheme, and content width percentage before first paint
      try {
        var lang = localStorage.getItem('kladde_lang');
        if (lang === 'en' || lang === 'de') document.documentElement.lang = lang;
      } catch (e) {}
      document.documentElement.dataset.theme = 'material';
      var scheme = 'dark';
      try {
        var cs = localStorage.getItem('kladde_color_scheme');
        if (cs === 'light') scheme = 'light';
        else if (cs === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) scheme = 'light';
      } catch (e) {}
      document.documentElement.dataset.scheme = scheme;
      try {
        var w = localStorage.getItem('kladde_widescreen');
        var cfg = w ? JSON.parse(w) : null;
        var pct = 80;
        if (cfg && typeof cfg.percent === 'number' && cfg.percent >= 35 && cfg.percent <= 100) {
          pct = Math.round(cfg.percent);
        } else if (cfg && cfg.mode === 'fluid') {
          pct = 100;
        }
        document.documentElement.dataset.widescreen = String(pct);
        document.documentElement.style.setProperty('--content-width', pct + '%');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
