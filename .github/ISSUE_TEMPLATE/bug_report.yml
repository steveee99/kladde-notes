name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security problems please do **not** open an issue, see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kladde version
      description: Shown in Settings, or in package.json.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Kladde?
      options:
        - Docker
        - Desktop mode (.exe / binary)
        - Local development (npm run dev)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPad, Chrome 140 on Windows, …
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove private information (notes, addresses, tokens).
