name: Demo (GitHub Pages)

# Builds the browser-only demo (`npm run build:demo`: no server, notes stay in the visitor's browser)
# and publishes it on GitHub Pages. Needs Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build:demo
        env:
          # e.g. /kladde-notes/ for a project page
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/
      # Deep links (/kladde-notes/n/<id>) have no file on Pages: its 404 page starts the app, which routes them
      - run: cp packages/client/dist-demo/index.html packages/client/dist-demo/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
