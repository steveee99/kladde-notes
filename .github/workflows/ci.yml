name: CI

# Pushes to main run CI as the first job of deploy.yml (no second run here).
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
