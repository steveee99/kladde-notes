name: CI

# Lint, build and test on GitHub-hosted runners only. There is no release or deploy
# pipeline in this repository.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # Build-time plugins (docs/PLUGINS.md): the example plugin must still fit the plugin API and build into the app
      - name: Build with the example plugin
        run: |
          npm run plugins -- --file examples/kladde.plugins.json --skip-install
          npm run build --workspace=packages/server
          npm run build --workspace=packages/client

  # Browser tests of the core flows (Playwright, Chromium) at phone, tablet and desktop sizes
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report, traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
