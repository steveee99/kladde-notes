# Builds and pushes the Kladde image with the pinned plugins whenever kladde.version, kladde.plugins.json or
# plugins/ change. A plugin that does not fit the Kladde version stops the build with a clear message.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kladde source at the pinned tag, plus the plugin list
        id: src
        run: |
          VERSION="$(tr -d '[:space:]' < kladde.version)"
          git clone --quiet --depth 1 --branch "$VERSION" https://github.com/steveee99/kladde-notes.git kladde
          cp kladde.plugins.json kladde/
          if [ -d plugins ]; then cp -R plugins/. kladde/plugins/; fi
          echo "tag=$VERSION-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Only needed for plugins from a private registry (here: GitHub Packages of the scope @team)
      - name: .npmrc for private plugin packages
        env:
          TOKEN: ${{ secrets.PLUGIN_PACKAGES_TOKEN }}
        run: printf '@team:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$TOKEN" > "$RUNNER_TEMP/npmrc"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: kladde
          push: true
          secret-files: npmrc=${{ runner.temp }}/npmrc
          tags: |
            ghcr.io/${{ github.repository_owner }}/kladde:${{ steps.src.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/kladde:latest
